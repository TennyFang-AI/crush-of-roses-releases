# Dev build — loads https://crush-of-roses-dev.pages.dev/
appId: com.slothgamelab.crushofroses
productName: Crush of Roses
directories:
  output: dist
files:
  - main.js
  - preload.js
  - splash.html
  - assets/crystal-rose-512-transparent.png
  - flavor.json
  - package.json
win:
  target: nsis
  artifactName: crush-of-roses-dev-setup.exe
nsis:
  oneClick: true
  # Custom "app is running" check (Batch 21): build/installer.nsh defines
  # customCheckAppRunning — an nsProcess exact-name probe in front of the
  # stock prompt/kill/retry flow. See that file for the rationale.
  include: installer.nsh
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Crush of Roses (Dev)
