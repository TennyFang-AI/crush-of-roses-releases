# Crush of Roses — wrapper builds.
# Push to main (or manual dispatch) builds the four wrapper artifacts
# (dev + live APK, dev + live Windows installer) and publishes them to
# the `latest` release in this repo, which is what the in-game install
# modal links to. APKs are signed release builds when the Android
# keystore secrets are set (ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD);
# without them the APK jobs fall back to unsigned debug builds.
# The Windows .exe is still unsigned.
# Two extra jobs (build-ios-dev, build-ios-live) compile-check the iOS
# wrapper for the simulator with signing disabled — they do NOT publish
# and do NOT produce an installable .ipa (that needs an Apple Developer
# Program membership + signing, not set up yet).
name: Build wrappers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-wrappers
  cancel-in-progress: true

jobs:
  build-apk-dev:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.14.3
      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Restore Android binary assets
        working-directory: .
        run: base64 -d android-assets.tar.gz.b64 | tar -xz -C android/
      - run: npm ci
      - run: npm run sync:dev
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo 'No Android keystore secret; APK job will fall back to an unsigned debug build.'
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/android/app/release.keystore"
          ls -l "$GITHUB_WORKSPACE/android/android/app/release.keystore"
      - name: Build APK (release if keystore present, else debug)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ -f "$GITHUB_WORKSPACE/android/android/app/release.keystore" ]; then
            gradle assembleRelease -PreleaseStoreFile="$GITHUB_WORKSPACE/android/android/app/release.keystore" -PreleaseStorePassword="$ANDROID_KEYSTORE_PASSWORD" -PreleaseKeyAlias="$ANDROID_KEY_ALIAS" -PreleaseKeyPassword="$ANDROID_KEY_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk ../crush-of-roses-dev.apk
          else
            gradle assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../crush-of-roses-dev.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: crush-of-roses-dev.apk
          path: android/crush-of-roses-dev.apk
          if-no-files-found: error

  build-apk-live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.14.3
      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Restore Android binary assets
        working-directory: .
        run: base64 -d android-assets.tar.gz.b64 | tar -xz -C android/
      - run: npm ci
      - run: npm run sync:live
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo 'No Android keystore secret; APK job will fall back to an unsigned debug build.'
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/android/app/release.keystore"
          ls -l "$GITHUB_WORKSPACE/android/android/app/release.keystore"
      - name: Build APK (release if keystore present, else debug)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ -f "$GITHUB_WORKSPACE/android/android/app/release.keystore" ]; then
            gradle assembleRelease -PreleaseStoreFile="$GITHUB_WORKSPACE/android/android/app/release.keystore" -PreleaseStorePassword="$ANDROID_KEYSTORE_PASSWORD" -PreleaseKeyAlias="$ANDROID_KEY_ALIAS" -PreleaseKeyPassword="$ANDROID_KEY_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk ../crush-of-roses.apk
          else
            gradle assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../crush-of-roses.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: crush-of-roses.apk
          path: android/crush-of-roses.apk
          if-no-files-found: error

  build-exe-dev:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:dev
      - uses: actions/upload-artifact@v4
        with:
          name: crush-of-roses-dev-setup.exe
          path: electron/dist/crush-of-roses-dev-setup.exe
          if-no-files-found: error

  build-exe-live:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:live
      - uses: actions/upload-artifact@v4
        with:
          name: crush-of-roses-setup.exe
          path: electron/dist/crush-of-roses-setup.exe
          if-no-files-found: error

  build-ios-dev:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore iOS binary assets
        working-directory: .
        run: base64 -d ios-assets.tar.gz.b64 | tar -xz -C android/
      - run: npm ci
      - run: npm run sync:ios-dev
      - name: Build for iOS Simulator (no signing)
        run: xcodebuild -project ios/App/App.xcodeproj -target App -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  build-ios-live:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore iOS binary assets
        working-directory: .
        run: base64 -d ios-assets.tar.gz.b64 | tar -xz -C android/
      - run: npm ci
      - run: npm run sync:ios-live
      - name: Build for iOS Simulator (no signing)
        run: xcodebuild -project ios/App/App.xcodeproj -target App -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  publish:
    needs: [build-apk-dev, build-apk-live, build-exe-dev, build-exe-live]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: crush-of-roses*
          merge-multiple: true
          path: release-assets
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la release-assets/
          gh release create latest --title "Latest builds" --notes "Latest wrapper builds (dev + live APK and Windows installer). Rebuilt on every push to main." || true
          gh release upload latest release-assets/crush-of-roses-dev.apk release-assets/crush-of-roses.apk release-assets/crush-of-roses-dev-setup.exe release-assets/crush-of-roses-setup.exe --clobber
